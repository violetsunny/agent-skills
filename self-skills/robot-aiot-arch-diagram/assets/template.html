<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <!-- 零外部请求硬约束：禁止引入 Google Fonts 等任何外链资源，一律使用系统字体栈。 -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif:    Georgia, 'Songti SC', 'SimSun', serif;
      --font-mono:     ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <!-- 标题单写原则：图表标题只进 SVG 内部的 <title>/<desc> 与图内文字，
         禁止在 HTML 层再写可见 h1/eyebrow，避免双标题。 -->

    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="[diagram-slug]-title [diagram-slug]-desc">
      <title id="[diagram-slug]-title">[Diagram title]</title>
      <desc id="[diagram-slug]-desc">[One sentence describing what the diagram shows]</desc>
      <defs>
        <marker id="arrow" markerWidth="9.4" markerHeight="6.6" viewBox="0 0 8 6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="9.4" markerHeight="6.6" viewBox="0 0 8 6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="9.4" markerHeight="6.6" viewBox="0 0 8 6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
        <!--
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        -->
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

      <!-- Draw arrows first, then nodes. Replace with your content. -->

    </svg>
  </div>
</body>
</html>
