<!DOCTYPE html>
<!-- 占位符：{{PAGE_TITLE}} {{EYEBROW}} {{H1}} {{SUBTITLE}} {{IFRAME_SRC}} {{IFRAME_TITLE}} {{IFRAME_HEIGHT}} {{CARDS}} {{FOOTER_LEFT}} {{FOOTER_DATE}} -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <!-- 默认零外联（公司 DLP：外联尝试即告警，无论成败）。品牌字体保真需求用 scripts/embed_fonts.py 注入内嵌 @font-face，见 references/offline-env.md -->
  <style>

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:       #f5f5f5;
      --color-paper-2:     #ececec;
      --color-ink:         #2d3142;
      --color-muted:       #4f5d75;
      --color-soft:        #5a6580;
      --color-rule:        rgba(45,49,66,0.12);
      --color-rule-solid:  rgba(79,93,117,0.25);
      --color-accent:      #bf4520;
      --color-accent-tint: rgba(191,69,32,0.08);
      --color-link:        #2e5aa8;
      --font-sans:   'Geist', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-serif:  'Instrument Serif', 'Noto Serif TC', 'Songti SC', 'SimSun', 'Times New Roman', serif;
      --font-mono:   'Geist Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); min-height: 100vh; padding: 3rem 2rem; color: var(--color-ink); }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { margin-bottom: 2.5rem; }
    .header-eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.75rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.75rem, 3vw + 1rem, 2.5rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; color: var(--color-ink); margin-bottom: 0.5rem; }
    .subtitle { font-family: var(--font-sans); font-size: 1rem; line-height: 1.55; color: var(--color-muted); max-width: 62ch; }
    .diagram-container { background: transparent; border: none; padding: 0; overflow-x: auto; }
    @media print { .diagram-container { overflow-x: visible; } .archify-fragment svg { min-width: 0; } }
    .cards { display: grid; grid-template-columns: 1.1fr 1fr 0.9fr 0.9fr; gap: 1rem; margin-top: 1.5rem; }
    @media (max-width: 1000px) { .cards { grid-template-columns: 1fr 1fr; } }
    .card { background: #ffffff; border-radius: 6px; border: 1px solid var(--color-rule); padding: 1.25rem; }
    .card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.875rem; padding-bottom: 0.875rem; border-bottom: 1px solid rgba(45,49,66,0.08); }
    .card-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .card-dot.ink { background: var(--color-ink); }
    .card-dot.muted { background: var(--color-muted); }
    .card-dot.coral { background: var(--color-accent); }
    .card-dot.link { background: var(--color-link); }
    .card h3 { font-family: var(--font-sans); font-size: 0.875rem; font-weight: 600; color: var(--color-ink); letter-spacing: -0.005em; }
    .card ul { list-style: none; color: var(--color-muted); font-size: 0.8125rem; line-height: 1.55; }
    .card li { margin-bottom: 0.3rem; padding-left: 0.875rem; position: relative; }
    .card li::before { content: '—'; position: absolute; left: 0; color: rgba(45,49,66,0.25); font-size: 0.75rem; }
    .card code { font-family: var(--font-mono); font-size: 0.75rem; color: var(--color-ink); }
    .footer { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(45,49,66,0.10); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--color-soft); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }


    .diagram-frame { width: 100%; height: {{IFRAME_HEIGHT}}px; border: 1px solid var(--color-rule); border-radius: 6px; background: #ffffff; display: block; }

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <p class="header-eyebrow">{{EYEBROW}}</p>
      <h1>{{H1}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
    </div>

    <div class="diagram-container">
      <iframe class="diagram-frame" src="{{IFRAME_SRC}}" title="{{IFRAME_TITLE}}"></iframe>
    </div>

    {{CARDS}}

    <div class="footer">
      <span>{{FOOTER_LEFT}}</span>
      <span>{{FOOTER_DATE}}</span>
    </div>
  </div>
</body>
</html>
