    <path d="M13 6l6 6" />
  </g>

    <g id="state-2">
      <rect x="1018" y="220" width="95" height="55" fill="#2D6A4F"/>
      <text x="1065" y="245" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="1065" y="265" font-size="18" fill="#FFFFFF" text-anchor="middle">升级完成</text>
    </g>
    <!-- icon: tabler-outline/arrow-right -->
  <g transform="translate(1120, 237) scale(0.916667)" fill="none" stroke="#2D3436" stroke-width="2">
    <path d="M5 12l14 0" />
    <path d="M13 18l6 -6" />
    <path d="M13 6l6 6" />
  </g>

    <g id="state-0">
